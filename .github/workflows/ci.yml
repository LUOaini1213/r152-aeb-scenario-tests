name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Vendored code identical to upstream
        run: python -I scripts/check_vendor.py
      - name: Unit tests, README numbers, local-path gate
        run: python -I -m pytest -q tests
      - name: Signal-level tests
        run: python -B -I -m pytest -q signal_level/tests -c signal_level/pytest.ini
      - name: Tests leave tracked files unchanged
        shell: bash
        run: git diff --exit-code
